<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Printer Monitor{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Printer Monitor</h1>
        <nav>
            {% if user.is_authenticated %}
                <span>Logado como {{ user.username }}</span>
                {% if user.is_superuser %}
                    <a href="{% url 'printer_monitor:user_list' %}">Usuários</a>
                {% endif %}
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Sair</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Entrar</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
